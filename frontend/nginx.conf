server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Written at container start by /docker-entrypoint.d/40-runtime-config.sh
    location = /config.js {
        alias /tmp/config.js;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
