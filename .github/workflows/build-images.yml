name: Build images

# The API and UI images the training-workbench chart deploys:
#   ghcr.io/<owner>/training-consolidation-workbench/{api,ui}:<commit sha>
# master also moves :latest, which the chart never defaults to. PRs build without pushing.
on:
  push:
    branches:
      - master
      - 'lane/**'
    paths-ignore:
      - 'sessions/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'sessions/**'
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The contract and fixture-mode tests need no stores. The other tests/*.py are
      # manual scripts over local test_docs/ decks and are not gated here.
      - name: Backend tests (contract + fixture mode)
        run: uv run --python 3.12 pytest -q tests/test_training_*.py tests/test_*fixture*.py

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: |
          helm lint charts/training-workbench --set api.image.tag=ci --set ui.image.tag=ci
          helm template ci charts/training-workbench --set api.image.tag=ci --set ui.image.tag=ci \
            --set ui.noAuth=true --set api.ingress.enabled=true --set api.ingress.host=api.ci.invalid \
            --set ui.ingress.enabled=true --set ui.ingress.host=ci.invalid > /dev/null

  images:
    needs: [test, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: .
          - component: ui
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo}/${{ matrix.component }}"
          tags="${image}:${{ github.sha }}"
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            tags="${tags},${image}:latest"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only for now: the API's unstructured[all-docs] stack is very slow under QEMU.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Record the digest for the chart
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo '```'
            echo "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo "${{ matrix.component }}.image.digest=${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
