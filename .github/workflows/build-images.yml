name: Build images

# The API and UI images the training-workbench chart deploys:
#   ghcr.io/<owner>/training-consolidation-workbench/{api,ui}:<commit sha>
# master also moves :latest, which the chart never defaults to. PRs build without pushing.
on:
  push:
    branches:
      - master
      - 'lane/**'
    paths-ignore:
      - 'sessions/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'sessions/**'
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The contract and fixture-mode tests need no stores. The other tests/*.py are
      # manual scripts over local test_docs/ decks and are not gated here.
      - name: Backend tests (contract + fixture mode)
        run: uv run --python 3.12 pytest -q tests/test_training_*.py tests/test_*fixture*.py

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: |
          helm lint charts/training-workbench --set api.image.tag=ci --set ui.image.tag=ci
          helm template ci charts/training-workbench --set api.image.tag=ci --set ui.image.tag=ci \
            --set ui.noAuth=true --set api.ingress.enabled=true --set api.ingress.host=api.ci.invalid \
            --set ui.ingress.enabled=true --set ui.ingress.host=ci.invalid > /dev/null

  images:
    needs: [test, chart]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Native runners per arch: the cluster is arm64, and the API's unstructured[all-docs]
      # stack is far too slow under QEMU. Each leg pushes by digest; merge tags the index.
      matrix:
        component: [api, ui]
        arch: [amd64, arm64]
        include:
          - component: api
            context: .
          - component: ui
            context: frontend
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo}/${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}

      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          # Artifact paths may not contain ':', so store the bare hex; merge adds sha256: back.
          digest="${{ steps.build.outputs.digest }}"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: [images]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, ui]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch index
        id: index
        working-directory: /tmp/digests
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo}/${{ matrix.component }}"
          tags="-t ${image}:${{ github.sha }}"
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            tags="${tags} -t ${image}:latest"
          fi
          docker buildx imagetools create ${tags} $(printf "${image}@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "${image}:${{ github.sha }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Record the digest for the chart
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo '```'
            echo "${{ steps.index.outputs.image }}@${{ steps.index.outputs.digest }}"
            echo "${{ matrix.component }}.image.digest=${{ steps.index.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
