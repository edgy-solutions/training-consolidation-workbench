[project]
name = "training-consolidation-workbench"
version = "0.1.0"
description = "Workbench for consolidating training material."
requires-python = ">=3.10"
dependencies = [
    "python-pptx",
    "minio",
    "requests",
    "python-dotenv",
    "neo4j",
    "weaviate-client<4.0.0",
    "baml-py",
    "pydantic",
    "dspy-ai",
    "fastapi",
    "uvicorn",
    "PyJWT[crypto]",
    "python-multipart",
    "sse-starlette"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
