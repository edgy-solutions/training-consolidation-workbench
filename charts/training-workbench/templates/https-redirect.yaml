{{- if and .Values.traefikHttpsRedirect (or (and .Values.api.enabled .Values.api.ingress.enabled) (and .Values.ui.enabled .Values.ui.ingress.enabled)) }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "tw.fullname" . }}-https-redirect
  labels:
    {{- include "tw.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
