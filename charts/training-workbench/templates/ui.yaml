{{- if .Values.ui.enabled }}
{{- $sel := dict "ctx" $ "component" "ui" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tw.fullname" . }}-ui
  labels:
    {{- include "tw.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "tw.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tw.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: ui
          image: {{ include "tw.image" (dict "ctx" $ "values" .Values.ui "component" "ui") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          # Written to /tmp/config.js at start by /docker-entrypoint.d/40-runtime-config.sh
          env:
            - name: VITE_API_URL
              value: {{ include "tw.apiUrl" . | quote }}
            - name: VITE_NO_AUTH
              value: {{ .Values.ui.noAuth | toString | quote }}
            - name: VITE_KEYCLOAK_REALM_URL
              value: {{ .Values.ui.keycloak.realmUrl | quote }}
            - name: VITE_KEYCLOAK_CLIENT_ID
              value: {{ .Values.ui.keycloak.clientId | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tw.fullname" . }}-ui
  labels:
    {{- include "tw.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
  selector:
    {{- include "tw.selectorLabels" $sel | nindent 4 }}
{{- end }}
