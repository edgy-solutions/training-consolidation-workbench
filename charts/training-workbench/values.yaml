# Images come from .github/workflows/build-images.yml:
#   <global.imageRegistry>/<component.image.name>@<digest>  or  :<tag> (the commit sha)
# Each component needs a digest or a tag. The repo's chart has no default; a released chart
# (release-chart.yml) carries the digests it was released with.
global:
  imageRegistry: ghcr.io/edgy-solutions/training-consolidation-workbench
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

api:
  enabled: true
  replicaCount: 1
  image:
    name: api
    digest: ""
    tag: ""
  # Where the source display reads from:
  #   fixture  the vendored contract fixture baked into the image; needs no stores
  #   store    the contract's Neo4j, MinIO and Weaviate, read through the SourceReader port
  #   direct   Neo4j, Weaviate and MinIO directly (the interim, until ADR-0060)
  sourceReader: fixture
  # Extra plain env, e.g. NEO4J_URI, NEO4J_USER, WEAVIATE_URL, MINIO_ENDPOINT, BUCKET_NAME,
  # LLM_BASE_URL, LLM_MODEL, LLM_NUM_CTX (an OpenAI-compatible endpoint such as a LiteLLM proxy;
  # else OLLAMA_BASE_URL, OLLAMA_MODEL, OLLAMA_NUM_CTX), KEYCLOAK_REALM_URL, WB_STORE_WRITES ("on" lets
  # /draft, /curriculum, /project, /synthesis write to Neo4j; held otherwise),
  # TOPAZ_DIRECTORY_URL (the fleet's Topaz directory; unset, every proposal review is refused).
  env: {}
  # The review capability asked of Topaz is can_review:<this>. Empty refuses every review.
  alignmentReviewSubject: alignment
  # true renders WB_ALIGNMENT_REVIEW_UI=on and shows the Review entry to users Topaz grants
  # can_review:<alignmentReviewSubject>; accepting/rejecting also needs WB_STORE_WRITES=on.
  alignmentReviewUi: false
  # The deck template export uses.
  deckTemplate:
    uri: ""                 # s3://<bucket>/<key> of the .pptx; empty = the stand-in
    mappingConfigMap: ""    # ConfigMap with key deck-template.yaml
    # s3://<bucket>/<prefix>: where templates saved from the settings screen are kept (<prefix>/active.yaml and
    # <prefix>/<sha256>.pptx). Empty = saving from the UI is off. A saved template wins over uri.
    store: ""
    # true renders WB_DECK_TEMPLATE_UI=on and shows the settings screen. Saving from it still needs the store,
    # WB_STORE_WRITES=on and the can_configure:deck_template grant. Exports ignore it.
    ui: false
  # A CA the api must trust beyond the public roots, e.g. for an https Keycloak, LLM or MinIO
  # signed by a private CA. An init container appends it to the image's system bundle, and
  # SSL_CERT_FILE / REQUESTS_CA_BUNDLE point at the result (it replaces, never adds to, the
  # default trust, so the bundle must be whole). Empty = system trust only.
  extraCA:
    secretName: ""          # existing Secret holding PEM certificate(s)
    key: ca-certificates.crt
  # Name of an existing Secret loaded whole with envFrom (NEO4J_PASSWORD, MINIO_ACCESS_KEY,
  # MINIO_SECRET_KEY, LLM_API_KEY, ...). The chart never creates secrets.
  existingSecret: ""
  service:
    type: ClusterIP
    port: 8000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    # The api answers every route under /api as well as at the root. On its own host keep ["/"].
    # To share the UI's host set ["/api"] (the chart refuses anything else there); the UI's apiUrl then
    # derives as <scheme>://<host>/api and the UI keeps every other path, so page routes like /alignment reach it.
    paths: ["/"]
    tls: []
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

ui:
  enabled: true
  replicaCount: 1
  image:
    name: ui
    digest: ""
    tag: ""
  # Browser-facing URL of the API. Empty: <scheme>://<api.ingress.host> when the API ingress is on,
  # https if api.ingress.tls is set and http otherwise.
  apiUrl: ""
  # true runs without Keycloak (sandbox and fixture mode); the backend's project routes then answer 401.
  noAuth: false
  keycloak:
    realmUrl: ""
    clientId: workbench-app
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    paths: ["/"]
    tls: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Traefik only: answer http on this chart's ingresses with a permanent redirect to https.
# Renders a traefik.io/v1alpha1 Middleware and attaches it to both ingresses.
traefikHttpsRedirect: false

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
